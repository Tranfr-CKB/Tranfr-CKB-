name: CI

on:
  push:
    branches: [main]
  pull_request:

# Vercel builds the demo on every push; this checks the same build, plus the
# tests, so a broken commit is caught before the deploy is looked at.
jobs:
  sdk:
    name: SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:sdk

  demo:
    name: Demo build and e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demo/package-lock.json
      # Only demo/node_modules, exactly as the Vercel build installs.
      - run: npm ci
        working-directory: demo
      - run: npm run build
        working-directory: demo
      - run: npx playwright install --with-deps chromium
        working-directory: demo
      # The lifecycle spec is excluded: it spends real testnet CKB and needs
      # funder keys. Run it by hand (see demo/e2e/lifecycle.spec.ts).
      - run: npm run e2e -- e2e/wallet-mode.spec.ts e2e/copy-address.spec.ts
        working-directory: demo
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: demo/playwright-report
          retention-days: 7
